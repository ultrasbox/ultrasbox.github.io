  <!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraBox JSON → MIDIコンバーター</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; line-height: 1.6; }
        h1 { color: #333; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
        .controls { background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #eee; }
        input[type="file"] { margin-bottom: 15px; display: block; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .message { margin-top: 20px; padding: 10px; border-radius: 5px; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>

    <h1>UltraBox JSON → MIDIコンバーター</h1>
    <p>JSONファイルをアップロードすると、8拍で切れない正確な伸ばし音を持つMIDIファイル（.mid）を生成します。</p>

    <div class="controls">
        <label for="jsonFile">① UltraBox JSONファイルを選択:</label>
        <input type="file" id="jsonFile" accept=".json">

        <button id="convertButton" disabled>② MIDIに変換してダウンロード</button>
    </div>

    <div id="messageArea" class="message" style="display: none;"></div>

    <script src="ultrabox-midi-converter.js"></script>

</body>
</html>
