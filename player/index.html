 <!DOCTYPE html>
<html lang="en">
<head>
	<link rel="shortcut icon" type="image/x-icon" href="../favicon.ico">
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>UltraBox Song Player</title> 
	<meta name="description" content="UltraBox is a mod of BeepBox that aims to combine every other beepmod into one." />
	<meta name="keywords" content="chiptune, instrumental, music, melody, composition, tool, square wave, NES, NSF, BeepBox" />
	<meta name="theme-color" content="#444" />
	<meta name="format-detection" content="telephone=no" />
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
	<link rel="icon" type="image/png" sizes="32x32" href="/icon_32.png" />
	<link href="../offline.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" rel="stylesheet" media="none" onload="if (this.media != 'all') this.media='all';" /> <meta name="robots" content="noindex, nofollow" />
	<style>
		html {
			width: 100vw;
			font-family: 'Roboto','Roboto-a', sans-serif;
			color: var(--primary-text, white);
			align-items: center;
		}
		html, body {
			height: 100%;
			overflow: hidden;
			display: flex;
			margin: 0;
			padding: 0;
			background: var(--page-margin, black);
		}
		body {
			width: 100vw;
			flex-direction: column;
			align-items: stretch;
		}
		/* 追加：入力周りのスタイル調整 */
		.input-container {
			padding: 10px;
			background: #333;
			display: none;
			gap: 10px;
		}
		input[name="url"] {
			flex-grow: 1;
			background: #222;
			color: white;
			border: 1px solid #555;
			padding: 5px;
		}
		button#updateBtn {
			background: #444;
			color: white;
			border: 1px solid #777;
			padding: 5px 15px;
			cursor: pointer;
		}
	</style>
	<script src="./../jquery-3.4.1.min.js"
			integrity="sha256-CSXorXvZcTkaix6Yvo6HppcZGetbYMGWSFlBw8HfCJo="
			crossorigin="anonymous"></script>
</head>
<body>
	

	<script type="text/javascript">
		function browserHasRequiredFeatures() {
			"use strict";
			if (window.AudioContext == undefined && window.webkitAudioContext == undefined) {
				return false;
			}
			
			try {
				eval("class T {}");
				eval("const a = () => 0");
				eval("for (const a of []);");
			} catch (error) {
				return false;
			}
			
			return true;
		}
		
		if (browserHasRequiredFeatures()) {
			var fileref = document.createElement("script");
			fileref.setAttribute("type", "text/javascript");
			fileref.setAttribute("src", "beepbox_player.min.js");
			document.head.appendChild(fileref);
		} else {
			document.body.innerHTML = "Sorry, BeepBox doesn't support your browser. Try a recent version of Chrome, Firefox, Edge, Safari, or Opera.";
		}

		// --- ハッシュ更新処理の追加 ---
		document.getElementById('updateBtn').addEventListener('click', function() {
			const inputVal = document.getElementById('songUrlInput').value;
			// 入力内容をURLのハッシュ（#以降）に設定
			window.location.hash = inputVal;
			console.log("Hash updated to: " + window.location.hash);
		});
	</script>
	<div class="input-container">
		<input name="url" type="text" id="songUrlInput" placeholder="Enter song data...">
		<button type="button" id="updateBtn">Update URL</button>
	</div>
</body>
</html>
